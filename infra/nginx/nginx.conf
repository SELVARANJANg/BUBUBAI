worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  gzip_min_length 1024;

  # Edge Rate Limiting Zone (10 req/sec per IP with burst)
  limit_req_zone $binary_remote_addr zone=bububai_api_limit:10m rate=10r/s;

  # Upstream Load Balancing across BUBUBAI app replicas (Service Discovery DNS)
  upstream bububai_backend {
    least_conn;
    server bububai-app:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Reverse Proxy Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Proxy-By "BUBUBAI-Nginx-Proxy" always;

    client_max_body_size 50m;

    # API Gateway & SSE Streaming Proxy
    location /api/ {
      limit_req zone=bububai_api_limit burst=20 nodelay;

      proxy_pass http://bububai_backend;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      # Essential for SSE AI Streaming responses
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 65s;
      proxy_connect_timeout 10s;
    }

    # Health check bypasses rate limiting
    location /api/health {
      proxy_pass http://bububai_backend/api/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend SPA & Static Assets
    location / {
      proxy_pass http://bububai_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
