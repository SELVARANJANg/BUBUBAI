services:
  bububai-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LB_STRATEGY=priority
      - CACHE_ENABLED=true
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bububai-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      bububai-app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bububai-net

networks:
  bububai-net:
    driver: bridge
