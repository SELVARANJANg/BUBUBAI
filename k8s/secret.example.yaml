# Template only — NEVER commit real API keys to source control.
# Create the real secret via kubectl:
#   kubectl create secret generic bububai-secrets \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=NVIDIA_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: bububai-secrets
  labels:
    app: bububai
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
  NVIDIA_API_KEY: "REPLACE_WITH_NVIDIA_API_KEY"
  OPENAI_API_KEY: ""
